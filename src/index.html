<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCG Craft</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>

<body>
    <main class="app">
        <header class="hero">
            <p class="eyebrow">Browser Prototype</p>
            <h1>CCG Craft</h1>
            <p class="tagline">Collectible card game design and management workspace.</p>
        </header>

        <section class="panel">
            <h2>Status</h2>
            <p id="status">Booting...</p>
        </section>

        <section class="panel">
            <h2>Card Lookup</h2>
            <p>
                <input type="text" id="card-lookup" placeholder="Enter card name..." />
            </p>
            <pre id="data-preview"></pre>
        </section>

        <section class="panel">
            <h2>Card Preview</h2>
            <canvas id="card-preview" width="480" height="560"></canvas>
        </section>

    </main>
</body>

</html>
