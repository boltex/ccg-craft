<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCG Craft</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
</head>

<body>
    <main class="app">
        <header class="hero">
            <p class="eyebrow">Browser Prototype</p>
            <h1>CCG Craft <span class="symbol"> </span><span class="exp-front"> </span><span class="exp-back"> </span>
            </h1>
            <p class="tagline">Collectible card game design and management workspace.</p>

        </header>

        <section class="panel">
            <h2>Status</h2>
            <p id="status">Booting...</p>
            <p>
                <button type="button" id="clear-art-cache">Clear DB</button>
                <button type="button" id="export-art-cache">Export DB</button>
                <button type="button" id="import-art-cache">Import DB</button>
                <input type="file" id="import-art-cache-file" accept="application/zip" hidden />
            </p>
        </section>

        <section class="panel">
            <h2>Sealed Deck</h2>
            <p>
                <button type="button" id="generate-sealed">Generate PDF</button>
                <span id="edition-checkboxes" class="edition-checkboxes"></span>
            </p>
        </section>

        <section class="panel">
            <h2>Constructed Deck</h2>

            <div class="row">
                <div class="col">
                    <p>
                        <textarea id="decklist-text" rows="10" placeholder="One card per line..."></textarea>
                    </p>
                </div>
                <div class="col">
                    <p>
                        <button type="button" id="generate-deck" disabled>Generate PDF</button>
                    </p>
                    <p>
                        <select id="decklist-paper-size">
                            <option value="letter">Letter 8.5 x 11 inches</option>
                            <option value="a4">A4 210 x 297 mm</option>
                        </select>
                    </p>
                    <p>
                        <button type="button" id="load-decklist">Load Decklist</button>
                        <button type="button" id="save-decklist">Save Decklist</button>
                        <button type="button" id="clear-decklist">Clear</button>
                        <input type="file" id="load-decklist-file" accept="text/plain" hidden />
                    </p>
                </div>
            </div>

        </section>

        <section class="panel">
            <h2>Card Lookup</h2>
            <p>
                <input type="text" id="card-lookup" placeholder="Enter card name..." />
                <button type="button" id="add-to-decklist" disabled>Add to decklist</button>
            </p>
        </section>

        <section class="panel">
            <h2>Card Preview</h2>
            <canvas id="card-preview" width="575" height="800"></canvas>
        </section>

        <section class="panel">
            <pre id="data-preview"></pre>
        </section>

    </main>
</body>

</html>
