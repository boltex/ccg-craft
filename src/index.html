<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCG Craft</title>
    <% if (googleTagId) { %>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=<%= googleTagId %>"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() { dataLayer.push(arguments); }
            gtag('js', new Date());
            gtag('config', '<%= googleTagId %>');
        </script>
        <% } %>
            <link rel="stylesheet" href="fonts.css">
            <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
            <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
            <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
            <link rel="manifest" href="site.webmanifest">
</head>

<body>
    <div class="frame-backdrop" aria-hidden="true">
        <!-- data-frame-index matches the constants.frame enum (frameL=0 ... frameZ=7) -->
        <div class="frame-bg" data-frame-index="0"></div>
        <div class="frame-bg" data-frame-index="1"></div>
        <div class="frame-bg" data-frame-index="2"></div>
        <div class="frame-bg" data-frame-index="3"></div>
        <div class="frame-bg" data-frame-index="4"></div>
        <div class="frame-bg" data-frame-index="5"></div>
        <div class="frame-bg" data-frame-index="6"></div>
        <div class="frame-bg" data-frame-index="7"></div>
        <div class="frame-bg-tint"></div>
    </div>
    <main class="app">
        <header class="hero">
            <p class="eyebrow">Félix's</p>
            <h1>CCG Craft</h1>
            <p class="tagline">Collectible card game print-sheet generator.</p>
            <!-- Assures fonts get preloaded for proper rendering. -->
            <span class="symbol"> </span><span class="exp-front"> </span><span class="exp-back"> </span>
        </header>

        <section class="panel">
            <h2>Status</h2>
            <p id="status">Booting...</p>
            <p>
                <button type="button" id="clear-art-cache" title="Clear Local Art Database">Clear DB</button>
                <button type="button" id="export-art-cache" title="Export Local Art Database">Export DB</button>
                <button type="button" id="import-art-cache" title="Import Local Art Database">Import DB</button>
                <input type="file" id="import-art-cache-file" accept="application/zip" hidden />
            </p>
        </section>

        <section class="panel">
            <nav class="deck-nav">
                <div class="deck-controls">
                    <select id="decklist-paper-size" title="Select the paper size for the exported PDF">
                        <!-- Single and double page of 3x3 cards in imperial sizes-->
                        <option value="letter">Letter (8.5" x 11")</option>
                        <option value="ledger">Ledger (17" x 11")</option>

                        <!-- Single and double page of 3x3 cards in metric sizes-->
                        <option value="a4">A4 (210 x 297 mm)</option>
                        <option value="a3">A3 (420 x 297 mm)</option>
                    </select>
                    <button type="button" id="generate-deck-pdf" title="Generate printable PDF" disabled>Generate
                        PDF</button>
                </div>
                <div class="deck-tabs">
                    <button type="button" class="deck-tab active" id="tab-constructed"
                        title="Switch to Constructed Deck Tab" data-deck-tab="constructed">Constructed</button>
                    <button type="button" class="deck-tab" id="tab-sealed" data-deck-tab="sealed"
                        title="Switch to Sealed Deck Tab">Sealed</button>
                    <button type="button" class="deck-tab" id="tab-sheet" data-deck-tab="sheet"
                        title="Switch to Uncut-Sheet Tab">Sheet</button>
                </div>
            </nav>

            <div class="deck-panel" id="deck-panel-constructed">
                <div class="row">
                    <div class="col">
                        <p class="mb-0">
                            <textarea id="decklist-text" rows="10" placeholder="One card per line..."
                                title="Type your decklist here."></textarea>
                        </p>
                    </div>
                    <div class="col">
                        <p class="user-instructions">
                            You can use a prefix like '2x Dark Ritual' for multiples
                            (200 card max).
                        </p>
                        <p class="mb-0 text-center">
                            <button type="button" id="load-decklist" title="Load decklist from a file">Load
                                Decklist</button>
                            <button type="button" id="save-decklist" title="Save current decklist to a file">Save
                                Decklist</button>
                            <button type="button" id="clear-decklist" title="Clear the current decklist">Clear</button>
                            <button type="button" id="add-p9-to-decklist"
                                title="Add the Power 9 cards to the decklist">Power 9</button>
                            <input type="file" id="load-decklist-file" accept="text/plain" hidden />
                        </p>
                    </div>
                </div>
            </div>

            <div class="deck-panel" id="deck-panel-sealed" hidden>
                <p class="user-instructions">
                    Select which sets to draw from to generate an 81 cards sealed deck
                </p>
                <p class="mb-0">
                    <span id="edition-checkboxes" class="edition-checkboxes"></span>
                </p>
            </div>

            <div class="deck-panel" id="deck-panel-sheet" hidden>
                <p class="user-instructions">
                    Uncut Sheets of Cards
                </p>
                <p class="mb-0 text-center">
                    <!-- Button to generate an uncut sheet of cards ONLY ONE AVAILABLE FOR NOW -->
                    <button type="button" id="generate-sheet" title="Generate an uncut sheet of cards">
                        Limited Rare
                    </button>
                </p>
            </div>

        </section>

        <section class="panel overflow-x-hidden">
            <h2>Card Lookup</h2>
            <p class="text-center mb-0">
                <input type="text" id="card-lookup" class="mb-20" placeholder="Enter card name..."
                    title="Type here to search for a card" />
                <button type="button" id="add-to-decklist" class="mb-20" disabled
                    title="Add the selected card to the decklist">Add to Decklist</button>
            </p>
            <canvas id="card-preview" width="575" height="800"></canvas>
        </section>


    </main>
</body>

</html>
