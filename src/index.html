<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCG Craft</title>
    <link rel="stylesheet" href="fonts.css">
</head>

<body>
    <main class="app">
        <header class="hero">
            <p class="eyebrow">Browser Prototype</p>
            <h1>CCG Craft</h1>
            <p class="tagline">Collectible card game design and management workspace.</p>
        </header>

        <section class="panel">
            <h2>Status</h2>
            <p id="status">Booting...</p>
        </section>

        <section class="panel">
            <h2>Card Lookup</h2>
            <p>
                <input type="text" id="card-lookup" placeholder="Enter card name..." />
            </p>
            <pre id="data-preview"></pre>
        </section>
    </main>
</body>

</html>
