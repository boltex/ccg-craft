<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCG Craft</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
</head>

<body>
    <main class="app">
        <header class="hero">
            <p class="eyebrow">Browser Prototype</p>
            <h1>CCG Craft <span class="symbol"> </span><span class="exp-front"> </span><span class="exp-back"> </span>
            </h1>
            <p class="tagline">Collectible card game design and management workspace.</p>

        </header>

        <section class="panel">
            <h2>Status</h2>
            <p id="status">Booting...</p>
            <p>
                <button type="button" id="clear-art-cache">Clear DB</button>
                <button type="button" id="export-art-cache">Export DB</button>
                <button type="button" id="import-art-cache">Import DB</button>
                <input type="file" id="import-art-cache-file" accept="application/zip" hidden />
            </p>
        </section>

        <section class="panel">
            <nav class="deck-nav">
                <div class="deck-controls">
                    <select id="decklist-paper-size">
                        <!-- Single and double page of 3x3 cards in imperial sizes-->
                        <option value="letter">Letter (8.5" x 11")</option>
                        <option value="ledger">Ledger (17" x 11")</option>

                        <!-- Single and double page of 3x3 cards in metric sizes-->
                        <option value="a4">A4 (210 x 297 mm)</option>
                        <option value="a3">A3 (420 x 297 mm)</option>
                    </select>
                    <button type="button" id="generate-deck-pdf" disabled>Generate PDF</button>
                </div>
                <div class="deck-tabs">
                    <button type="button" class="deck-tab active" id="tab-constructed"
                        data-deck-tab="constructed">Constructed</button>
                    <button type="button" class="deck-tab" id="tab-sealed" data-deck-tab="sealed">Sealed Deck</button>
                </div>
            </nav>

            <div class="deck-panel" id="deck-panel-constructed">
                <div class="row">
                    <div class="col">
                        <p class="mb-0">
                            <textarea id="decklist-text" rows="10" placeholder="One card per line..."></textarea>
                        </p>
                    </div>
                    <div class="col">
                        <p class="mb-0 text-center">
                            <button type="button" id="load-decklist">Load Decklist</button>
                            <button type="button" id="save-decklist">Save Decklist</button>
                            <button type="button" id="clear-decklist">Clear</button>
                            <button type="button" id="add-p9-to-decklist">Power 9</button>
                            <input type="file" id="load-decklist-file" accept="text/plain" hidden />
                        </p>
                    </div>
                </div>
            </div>

            <div class="deck-panel" id="deck-panel-sealed" hidden>
                <p class="mb-0">
                    <span id="edition-checkboxes" class="edition-checkboxes"></span>
                </p>
            </div>
        </section>

        <section class="panel overflow-x-hidden">
            <h2>Card Lookup</h2>
            <p class="text-center mb-0">
                <input type="text" id="card-lookup" class="mb-20" placeholder="Enter card name..." />
                <button type="button" id="add-to-decklist" class="mb-20" disabled>Add to Decklist</button>
            </p>
            <canvas id="card-preview" width="575" height="800"></canvas>
        </section>

    </main>
</body>

</html>
